modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"

[features.combo]
javaVersion = "[${java_version},)"

[[mods]]
modId = "combo"
version = "${version}"
displayName = "Combo"
authors = "Vg34100"
description = '''
Melee combos, finishers, timed parries, stealth takedowns, stamina and directional dodges.
'''
${neoforge_icon_field} = "assets/combo/icon.png"

[[dependencies.combo]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.combo]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.combo]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "combo.mixins.json"
